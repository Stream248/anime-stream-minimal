<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary SEO -->
  <title>Comic Home — Anime Recommendations by Taste</title>
  <meta
    name="description"
    content="Discover anime and manga recommendations matched to your taste. Browse the live trending chart, search the full catalog by title, and find your next favorite series on Comic Home."
  />
  <meta
    name="keywords"
    content="anime recommendations, manga recommendations, trending anime, anime database, anime search, anime by taste, what to watch anime, myanimelist"
  />
  <meta name="author" content="Comic Home" />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="canonical" href="https://comichome.app/" />

  <!-- Open Graph (Facebook, LinkedIn, WhatsApp, Discord) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Comic Home" />
  <meta property="og:title" content="Comic Home — Anime Recommendations by Taste" />
  <meta
    property="og:description"
    content="Browse the live trending anime chart, search the full catalog, and get recommendations matched to your taste. Free, no account needed."
  />
  <meta property="og:url" content="https://comichome.app/" />
  <meta property="og:image" content="https://comichome.app/logo.svg" />
  <meta property="og:image:alt" content="Comic Home — anime recommendations by taste" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter / X card -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Comic Home — Anime Recommendations by Taste" />
  <meta
    name="twitter:description"
    content="Browse the live trending anime chart, search the full catalog, and get recommendations matched to your taste."
  />
  <meta name="twitter:image" content="https://comichome.app/logo.svg" />

  <!-- Structured data: WebSite + SearchAction so search engines can offer
       sitelinks search directly to our /search page. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Comic Home",
    "alternateName": "Comic Home Anime & Manga",
    "url": "https://comichome.app/",
    "description": "Anime and manga recommendations matched to your taste. Browse the trending chart or search the full catalog.",
    "inLanguage": "en",
    "potentialAction": {
      "@type": "SearchAction",
      "target": {
        "@type": "EntryPoint",
        "urlTemplate": "https://comichome.app/search?q={search_term_string}"
      },
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
</head>


<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
